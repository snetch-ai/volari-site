<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volari — skill tracking for gymnastics gyms</title>
  <meta name="description" content="Volari helps gymnastics coaches track skill progress in seconds and keeps parents in the loop automatically.">
  <style>
    :root {
      --bg: #fafafa; --fg: #1a1a2e; --muted: #6b6b80; --accent: #5b5bd6;
      --card: #ffffff; --border: #e6e6ef;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0e16; --fg: #ececf4; --muted: #9a9ab0; --accent: #8a8af0; --card: #16161f; --border: #26263a; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--fg);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px;
    }
    main { max-width: 560px; text-align: center; }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 28px; border-radius: 18px;
      background: linear-gradient(135deg, #2d1b69, #1a1040);
      display: flex; align-items: center; justify-content: center;
      color: #b8a6ff; font-size: 38px; font-weight: 700; font-style: italic;
      font-family: Georgia, serif;
    }
    h1 { font-size: 32px; letter-spacing: -0.02em; margin-bottom: 12px; }
    p { color: var(--muted); margin-bottom: 32px; }
    .links a { color: var(--accent); text-decoration: none; font-weight: 500; margin: 0 12px; }
    .links a:hover { text-decoration: underline; }
    footer { margin-top: 48px; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">V</div>
    <h1>Volari</h1>
    <p>Skill tracking for gymnastics gyms. Coaches log progress in seconds on the floor — parents see every milestone, automatically.</p>
    <nav class="links">
      <a href="/privacy/">Privacy Policy</a>
      <a href="mailto:privacy@volariapp.com">Contact</a>
    </nav>
    <footer>© 2026 Volari</footer>
  </main>
</body>
</html>
